; ============================================================
; PlatformIO Project Configuration
; ============================================================

[platformio]
default_envs = esp32dev


; ============================================================
; Arduino UNO Environment
; ============================================================

[env:uno]
platform = atmelavr
board = UNO
framework = arduino

build_flags =
    -DROVER_PLATFORM_ARDUINO


; ============================================================
; ESP32 Development Environment
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino


; ------------------------------------------------------------
; Build Configuration
; ------------------------------------------------------------

build_flags =
    -DROVER_PLATFORM_ESP32
    -Og
    -g3


; ------------------------------------------------------------
; Serial Monitor Configuration
; ------------------------------------------------------------

monitor_speed = 115200
monitor_filters =
    time
;    log2file


; ------------------------------------------------------------
; Upload / Debug Configuration
; ------------------------------------------------------------

upload_protocol = esptool

debug_tool = esp-prog
debug_init_break = tbreak setup