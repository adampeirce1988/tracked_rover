[env:esp32dev]

platform = espressif32
board = esp32dev
framework = arduino

lib_ldf_mode = deep+

board_build.filesystem = littlefs

; ------------------------------------------------------------
; Build Configuration
; ------------------------------------------------------------

build_flags =
    -DROVER_PLATFORM_ESP32
    -Og
    -g3

; ------------------------------------------------------------
; Serial Monitor Configuration
; ------------------------------------------------------------

monitor_speed = 115200

monitor_filters =
    time

;    log2file

; ------------------------------------------------------------
; Upload / Debug Configuration
; ------------------------------------------------------------

upload_protocol = esptool
debug_tool = esp-prog
debug_init_break = tbreak setup