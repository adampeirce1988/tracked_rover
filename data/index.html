<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP-Nexus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .card {
            background: #1f2937;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status {
            color: #4ade80;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ESP-Nexus</h1>

        <p class="subtitle">
            ESP32 Control Interface
        </p>

        <div class="card">
            <h2>System Status</h2>

            <p>
                Status:
                <span class="status">Online</span>
            </p>

            <p>
                ESP32 web server is running.
            </p>
        </div>

        <div class="card">
            <h2>Firmware</h2>

            <p>
                OTA firmware updates will go here.
            </p>
        </div>

    </div>

</body>

</html>
