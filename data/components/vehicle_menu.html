
<!-- Vehicle status menu -->
<nav class="vehicle-status-menu" aria-label="Vehicle-status">
     
    <button class="vehicle-status-button" 
        type="button" 
        aria-label="Open vehicle status menu" 
        aria-expanded="false">

     <span class="vehicle-status-indicator">⚠️</span>

     <div class="vehicle-status-summary"> 
        <span class="vehicle-state-value">----</span>
        <span class="vehicle-battery-summary">12.43v</span>
     </div>

     <span class="vehicle-status-arrow">▼</span>

    </button>

    <div class="vehicle-status-dropdown"> 

        <div class="vehicle-detail-row"> 
            <span>State</span>
            <span class="vehicle-state-value">----</span>
        </div>

        <div class="vehicle-detail-row">
            <span>Battery</span>
            <span class="vehicle-battery-value">13.12v</span>
        </div>

        <div class="vehicle-detail-row">
            <span>Current</span>
            <span class="vehicle-current-value">0.3a</span>
        </div>
                 
        <div class="vehicle-detail-row">
            <span>odometer</span>
            <span class="vehicle-odometer-value">0.76km</span>
        </div>

        <div class="vehicle-detail-row">
            <span>Hours</span>
            <span class="vehicle-runtime-value">0.3h</span>
        </div>

    </div>

</nav>
