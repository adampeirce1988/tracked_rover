<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        
        <link rel="stylesheet" href="style.css"> 

    </head>

    <body>

        <!--=========================================================================*
        * Menu
        *=========================================================================-->
        <div id="main-menu-container"></div>
        <div id="vehicle-status-container"></div>

        <span class="page-name" hidden>Update</span>

        <!--=========================================================================*
        * page content 
        *=========================================================================-->
        
        <main class="container">

            <section class="card">

                <h2>ESP32 Firmware</h2>

                <div class="firmware-file-selection">
                    <label for="firmware-file" class="firmware-file-button">
                        Choose File
                    </label>

                    <input
                        type="file"
                        id="firmware-file"
                        accept=".bin"
                        hidden
                    >

                    <span id="firmware-file-name">No file selected</span>
                </div>

                <div class="firmware-progress-selection">

                    <button type="button" id="firmware-upload-button">
                        Upload Firmware
                    </button>

                    <!-- Firmware update progress bar -->
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                        <span id="progress-text">0%</span>
                    </div>

                </div>

            </section>

        </main>

        <script src="/scripts.js"> </script> 
        <script src="/update.js"></script>

    </body>

</html>
